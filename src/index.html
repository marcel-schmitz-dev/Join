<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Join</title>

    <link rel="icon" type="image/png" href="assets/Join-logo.png" />

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        if (localStorage.getItem('join-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
    <style>
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background-color: #07080f;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
